name: Build Android APK

on:
  push:
    branches: [ "main", "основной" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.2

    - name: Unzip project code
      run: |
        unzip -q wcsspoof-lsposed-module-3.zip -d extracted_project
        if [ -d "extracted_project/wcsspoof-lsposed-module" ]; then
          mv extracted_project/wcsspoof-lsposed-module/* .
        elif [ -d "extracted_project/wcsspoof-lsposed-module-3" ]; then
          mv extracted_project/wcsspoof-lsposed-module-3/* .
        else
          mv extracted_project/*/* . || mv extracted_project/* . || true
        fi

    - name: Build Release APK
      run: gradle assembleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: lsposed-module-apk
        path: |
          **/build/outputs/apk/release/*.apk
